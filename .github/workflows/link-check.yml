name: Link check

on:
  schedule:
    - cron: "0 3 * * 1"   # every Monday 03:00 UTC
  pull_request:
    paths: ["**/*.md"]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check links
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --max-retries 3
            --accept 200,206,403,429
            --exclude-path .github
            "./**/*.md"
          fail: false

      - name: Open issue on scheduled failure
        if: steps.lychee.outputs.exit_code != 0 && github.event_name == 'schedule'
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: Dead links found by weekly check
          content-filepath: ./lychee/out.md
          labels: dead-link
